<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mm-rim" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F2551B"/>
    </linearGradient>
    <linearGradient id="mm-face" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#FFBE55"/>
      <stop offset="0.55" stop-color="#FF9330"/>
      <stop offset="1" stop-color="#FA6A22"/>
    </linearGradient>
    <linearGradient id="mm-glyph" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="400">
      <stop offset="0" stop-color="#FFF9F0"/>
      <stop offset="1" stop-color="#F6E6D2"/>
    </linearGradient>
    <filter id="mm-face-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#B8380A" flood-opacity="0.35"/>
    </filter>
    <filter id="mm-glyph-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#A8360C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Two-layer badge: rim + slightly raised face -->
  <circle cx="256" cy="256" r="240" fill="url(#mm-rim)"/>
  <circle cx="256" cy="256" r="208" fill="url(#mm-face)" filter="url(#mm-face-shadow)"/>

  <!-- Beamed eighth notes with a spark -->
  <g filter="url(#mm-glyph-shadow)"><g fill="url(#mm-glyph)" transform="rotate(-8 256 256) translate(-4 6)">
    <!-- beam -->
    <path d="M205 146 L355 112 Q371 108 371 125 L371 157 Q371 172 355 176 L205 210 Q189 214 189 197 L189 165 Q189 150 205 146 Z"/>
    <!-- stems -->
    <rect x="189" y="170" width="28" height="180" rx="14"/>
    <rect x="343" y="136" width="28" height="180" rx="14"/>
    <!-- heads -->
    <ellipse cx="170" cy="348" rx="50" ry="38" transform="rotate(-22 170 348)"/>
    <ellipse cx="324" cy="314" rx="50" ry="38" transform="rotate(-22 324 314)"/>
    <!-- spark -->
    <path d="M128 150 Q132 186 160 192 Q132 198 128 234 Q124 198 96 192 Q124 186 128 150 Z"/>
    <path d="M402 330 Q404 350 420 354 Q404 358 402 378 Q400 358 384 354 Q400 350 402 330 Z"/>
  </g></g>
</svg>
